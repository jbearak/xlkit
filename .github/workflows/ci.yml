name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
        working-directory: src/rust
      - run: cargo test --locked
        working-directory: src/rust
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src/rust

  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      # R on Windows links with Rtools' gcc, so the Rust library is built
      # for the GNU target (src/Makevars.win).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      # R CMD check --as-cran checks configure with checkbashisms on Linux
      # and macOS, and warns when it is missing.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - if: runner.os == 'macOS'
        run: brew install checkbashisms
      # R CMD check warns when crates are downloaded while installing, so
      # fetch the pinned crates first.
      - run: cargo fetch --locked
        working-directory: src/rust
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

  # The examples in docs/r.md's reading sections, run against the
  # installed package; their output must match the docs.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - run: R CMD INSTALL .
      - run: Rscript tools/check-docs.R
